<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Correspondance — the Paris Métro guessing game</title>
<meta name="description" content="A pass-the-phone Paris Métro guessing game for 3 to 8 players. Lines, landmarks, termini and station counts, in English or French.">
<style>
  /* Light is the default here: a signage-white page, navy ink, one hot accent. */
  :root{
    --bg:#eef1f6; --card:#ffffff; --card2:#f3f6fa; --line:#dde3ec;
    --ink:#0b1524; --dim:#5b6678; --good:#0f7a37; --bad:#c62828;
    --accent:#e32017; --onAccent:#ffffff;
    --fill:#0b1524; --onFill:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b1017; --card:#151c26; --card2:#1c2430; --line:#2a3441;
           --ink:#eef2f8; --dim:#93a1b4; --good:#3fb950; --bad:#f2564a;
           --accent:#ff4a3d; --onAccent:#ffffff;
           --fill:#212c3b; --onFill:#ffffff; }
  }
  /* the viewer's own theme toggle must beat the OS preference, both ways */
  :root[data-theme=light]{ --bg:#eef1f6; --card:#ffffff; --card2:#f3f6fa; --line:#dde3ec;
    --ink:#0b1524; --dim:#5b6678; --good:#0f7a37; --bad:#c62828;
    --accent:#e32017; --onAccent:#ffffff; --fill:#0b1524; --onFill:#ffffff; }
  :root[data-theme=dark]{ --bg:#0b1017; --card:#151c26; --card2:#1c2430; --line:#2a3441;
    --ink:#eef2f8; --dim:#93a1b4; --good:#3fb950; --bad:#f2564a;
    --accent:#ff4a3d; --onAccent:#ffffff; --fill:#212c3b; --onFill:#ffffff; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px}
  /* Display type: heavy, uppercase, tightly tracked — station-sign voice.
     font-stretch narrows it where the platform's UI font is variable. */
  h1{font-size:clamp(30px,9vw,46px);margin:0;font-weight:900;line-height:1;
    text-transform:uppercase;letter-spacing:.01em;font-stretch:condensed;text-wrap:balance}
  h1 small{display:block;font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.18em;
    text-transform:uppercase;margin-bottom:8px;font-stretch:normal}
  /* the 16 lines, in order, as a signature rule — drawn from the real palette */
  .linestrip{display:flex;height:7px;border-radius:4px;overflow:hidden;margin:18px 0 4px}
  .linestrip i{flex:1}
  .screen{display:none} .screen.on{display:block;animation:in .25s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    .screen.on{animation:none}
    button:active{transform:none}
  }
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .bullet{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;
    font-weight:800;font-size:13px;flex:0 0 auto;letter-spacing:-.02em}
  .bullet.big{width:52px;height:52px;font-size:22px}
  .swatch{display:inline-block;width:1.9em;height:.65em;border-radius:3px;vertical-align:baseline}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}
  .lede{color:var(--dim);margin:14px 0 0}
  label{display:block;font-size:13px;font-weight:600;color:var(--dim);margin:0 0 6px}
  input[type=text],select{width:100%;background:var(--card2);color:var(--ink);
    border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:16px;font-family:inherit}
  .rowin{display:flex;gap:8px}
  .rowin input{flex:1}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .stack{margin-top:14px}

  button{font:inherit;font-weight:700;cursor:pointer;border-radius:11px;
    background:var(--card2);color:var(--ink);border:1px solid var(--line);padding:13px 16px;
    min-height:46px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none}
  button:active{transform:scale(.985)}
  /* 16px is the threshold below which iOS zooms the page on focus */
  input[type=text]{font-size:16px;min-height:46px}
  .primary{background:var(--accent);color:var(--onAccent);border-color:transparent;width:100%;
    padding:17px;font-size:15px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;
    border-radius:13px}
  .primary:disabled{opacity:.32;cursor:not-allowed}
  .ghost{background:transparent;color:var(--dim);border-color:transparent;text-decoration:underline;
    text-underline-offset:3px}

  /* language toggle */
  .topbar{display:flex;justify-content:flex-end;margin-bottom:10px}
  .langs{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .langs button{border:0;border-radius:0;background:transparent;color:var(--dim);
    padding:7px 14px;font-size:13px;letter-spacing:.05em}
  .langs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
  .langs button{min-height:34px}

  ul{list-style:none;margin:0;padding:0}
  #players li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);font-weight:600}
  #players li:last-child{border:0}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  .x{margin-left:auto;background:transparent;border:0;color:var(--dim);font-size:20px;padding:2px 8px;line-height:1}
  #hint{color:var(--dim);font-size:14px;margin:12px 0 0;text-align:center}

  #pass .card{text-align:center;padding:56px 20px}
  #passName{font-size:clamp(30px,9vw,44px);font-weight:800;margin:10px 0 4px;letter-spacing:-.02em}
  #passMeta{color:var(--dim);font-size:14px;margin-bottom:26px}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}

  .qhead{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);font-weight:600;flex-wrap:wrap}
  .qhead b{font-weight:800;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
  .passchip{display:block;width:44px;height:6px;border-radius:3px;margin:14px auto 0}
  #clock{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink)}
  .tag{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11px;
    letter-spacing:.08em;text-transform:uppercase}
  .track{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 18px}
  #bar{height:100%;background:var(--accent);width:100%}
  #qText{font-size:clamp(20px,5vw,26px);font-weight:700;line-height:1.3;letter-spacing:-.01em;margin:0}
  #qText em{font-style:normal;border-bottom:2px solid var(--accent);padding-bottom:1px}
  #qNote{color:var(--dim);font-size:14px;margin:10px 0 0}
  #choices{display:grid;gap:10px;margin-top:20px}
  /* bullets and numbers pair up two-per-row so all four fit without scrolling */
  #choices.twoup,#choices2.twoup{grid-template-columns:1fr 1fr}
  .choice{display:flex;align-items:center;justify-content:center;gap:10px;min-height:66px;
    background:var(--card);padding:12px}
  .choice .num{font-size:24px;font-weight:800}
  .choice .stn{font-size:17px;font-weight:700;text-align:center}
  .choice.right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
  .choice.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
  .choice:disabled{cursor:default;opacity:1}
  #typed{margin-top:20px}
  #typedInput{font-size:19px;font-weight:700;padding:16px 14px;text-align:center}
  #typedSubmit{margin-top:10px}
  #typedGiveUp{display:block;margin:10px auto 0}

  .verdict{font-size:28px;font-weight:800;margin:0 0 8px;letter-spacing:-.02em}
  .verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
  #explain{margin:0 0 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  #gain{font-weight:800;font-size:18px}
  #gain .sub{font-weight:500;color:var(--dim);font-size:14px}
  #standings li{display:flex;align-items:center;gap:10px;padding:9px 2px;font-size:15px;color:var(--dim)}
  #standings li.me{color:var(--ink);font-weight:700}
  #standings b{margin-left:auto;font-variant-numeric:tabular-nums}

  #winner{font-size:clamp(26px,7vw,36px);font-weight:800;letter-spacing:-.02em;margin:6px 0 18px}
  #podium li{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line)}
  #podium li:last-child{border:0}
  .rank{width:24px;font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums}
  .nm{font-weight:700}
  .det{margin-left:auto;color:var(--dim);font-size:13px}
  #podium b{width:64px;text-align:right;font-variant-numeric:tabular-nums;font-size:18px}

  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:9}
  #modal.on{display:flex}
  .sheetbox{background:var(--card);width:100%;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;
    padding:20px 16px calc(20px + env(safe-area-inset-bottom));margin:0 auto;max-width:640px}
  @media(min-width:641px){#modal{align-items:center}.sheetbox{border-radius:18px;max-height:80vh}}
  .sheetbox h2{margin:0 0 4px;font-size:20px}
  #sheet .row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  #sheet .row:last-child{border:0}
  .tm{font-weight:650;font-size:15px;line-height:1.35}
  .ct{color:var(--dim);font-size:13px}
  .foot{color:var(--dim);font-size:12px;text-align:center;margin-top:26px;line-height:1.6}

  /* crossword */
  .gridwrap{display:flex;justify-content:center;margin:14px 0 10px;overflow-x:auto}
  #crossGrid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:2px;
    width:100%;max-width:min(100%,var(--cols)*40px)}
  .xc{position:relative;aspect-ratio:1;background:var(--card);border:1px solid var(--line);
    border-radius:3px;display:grid;place-items:center;font-weight:800;
    font-size:clamp(11px,3.4vw,19px);text-transform:uppercase;cursor:pointer;
    -webkit-user-select:none;user-select:none;touch-action:manipulation}
  .xc.block{background:transparent;border-color:transparent;cursor:default}
  .xc b{position:absolute;top:1px;left:2px;font-size:8px;font-weight:700;color:var(--dim);line-height:1}
  .xc.inword{background:color-mix(in srgb,var(--accent) 11%,var(--card))}
  .xc.here{outline:2px solid var(--accent);outline-offset:-2px;
    background:color-mix(in srgb,var(--accent) 22%,var(--card))}
  /* letters you were handed, not ones you worked out */
  .xc.given{color:var(--accent)}
  .xc.ok{color:var(--good)}
  .xc.no{color:var(--bad);text-decoration:line-through}
  /* offscreen, but focusable — this is what opens the phone keyboard */
  #crossInput{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;min-height:0}
  .curclue{text-align:center;font-weight:700;margin:4px 0 14px;min-height:1.5em}
  .shapes{display:flex;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;
    margin:16px auto 8px;width:fit-content;background:var(--card)}
  .shapes button{border:0;border-radius:0;background:transparent;color:var(--dim);
    padding:9px 20px;font-size:14px;min-height:42px}
  .shapes button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
  .crossbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(min-width:520px){.crossbtns{grid-template-columns:repeat(4,1fr)}}
  .crossbtns button{font-size:13px;padding:12px 6px}
  .crossmsg{text-align:center;font-weight:700;margin:6px 0 0;min-height:1.4em}
  .crossmsg.good{color:var(--good)} .crossmsg.bad{color:var(--bad)}
  .clues li{display:flex;gap:10px;padding:9px 2px;font-size:14px;line-height:1.4;cursor:pointer;
    border-bottom:1px solid var(--line);color:var(--dim)}
  .clues li:last-child{border:0}
  .clues li.on{color:var(--ink);font-weight:600}
  .clues .n{font-weight:800;color:var(--ink);min-width:18px;font-variant-numeric:tabular-nums}
  .clues .len{color:var(--dim);font-weight:500}

  /* A question must fit on one screen — nobody should scroll to find option 4
     while the clock is running. These tighten as the screen gets shorter. */
  @media (max-height: 780px){
    .wrap{padding-top:12px;padding-bottom:20px}
    .topbar{margin-bottom:6px}
    .card{padding:15px}
    .choice{min-height:54px}
    #choices,#choices2{gap:8px;margin-top:14px}
    .bullet.big{width:44px;height:44px;font-size:19px}
    .track{margin:8px 0 13px}
    #qText{font-size:20px}
    #qNote{margin-top:7px;font-size:13px}
    #answeredLine{margin-top:12px;font-size:13px}
  }
  @media (max-height: 660px){
    .card{padding:12px}
    .choice{min-height:48px}
    #choices,#choices2{gap:6px;margin-top:11px}
    .bullet.big{width:38px;height:38px;font-size:17px}
    .choice .stn{font-size:15px}
    .choice .num{font-size:21px}
    #qText{font-size:18px}
    .qhead{font-size:12px;gap:7px}
    #typedInput,#typedInput2{padding:12px;font-size:17px}
  }

  /* home + live rooms */
  /* The two ways to play, as the page's main event: one filled, one outlined,
     each with a coloured rail down its left edge. */
  .choices2{display:grid;gap:12px;margin-top:20px}
  .bigopt{display:block;text-align:left;padding:19px 20px;background:var(--card);
    border:1px solid var(--line);border-radius:16px;border-left:7px solid var(--accent)}
  .bigopt .opt{display:block;font-size:19px;font-weight:900;text-transform:uppercase;
    letter-spacing:.02em;font-stretch:condensed}
  .bigopt .optsub{display:block;color:var(--dim);font-weight:500;font-size:14px;margin-top:5px;
    text-transform:none;letter-spacing:0}
  #homeSolo{background:var(--fill);color:var(--onFill);border-color:transparent;
    border-left:7px solid #FFCE00}
  #homeSolo .optsub{color:rgba(255,255,255,.66)}
  .orline{text-align:center;color:var(--dim);margin:6px 0}
  #onlineFlow{display:flex;flex-direction:column}
  #createBlock{order:1} #joinBlock{order:2}
  /* arriving from a shared link: joining is the point, hosting is the afterthought */
  #online.invited #joinBlock{order:1;margin-top:0}
  #online.invited #createBlock{order:2;margin-top:18px}
  #online.invited #createBtn{background:transparent;color:var(--dim);border:1px solid var(--line)}
  #online.invited .orline{display:none}
  #online.invited #joinBtn{background:var(--accent);color:#000;border-color:transparent}
  .center{text-align:center}
  .dimtext{color:var(--dim);font-size:14px}
  .notice{background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid var(--accent);
    border-radius:11px;padding:10px 14px;font-size:14px;font-weight:600;margin:0 0 14px}
  .code{font-size:clamp(44px,15vw,72px);font-weight:800;letter-spacing:.18em;margin:6px 0 10px;
    font-variant-numeric:tabular-nums}
  #roomLink{margin:14px 0 10px;text-align:center;font-size:16px;color:var(--dim);
    text-overflow:ellipsis;cursor:text}
  .lobbybtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .hostbanner{display:flex;flex-direction:column;gap:3px;background:color-mix(in srgb,var(--accent) 15%,transparent);
    border:1px solid var(--accent);border-radius:14px;padding:13px 16px;margin-bottom:4px}
  .localwarn{display:flex;flex-direction:column;gap:6px;align-items:flex-start;
    background:color-mix(in srgb,var(--bad) 14%,transparent);border:1px solid var(--bad);
    border-radius:14px;padding:14px 16px;margin-bottom:4px}
  .localwarn strong{font-size:15px}
  .localwarn span{color:var(--dim);font-size:13px;line-height:1.45}
  .localwarn .gobtn{display:inline-flex;align-items:center;min-height:46px;margin-top:4px;
    background:var(--accent);color:#000;text-decoration:none;font-weight:700;font-size:15px;
    padding:0 16px;border-radius:10px;touch-action:manipulation}
  .hostbanner strong{font-size:15px}
  .hostbanner span{color:var(--dim);font-size:13px;line-height:1.45}
  .lb li{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:15px}
  .lb li:last-child{border:0}
  .lb .nm{font-weight:700}
  .lb .det{margin-left:auto;color:var(--dim);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
  .lb b{margin-left:auto;font-variant-numeric:tabular-nums;font-size:17px}
  .lb .gainpill{margin-left:auto;color:var(--good);font-weight:700;font-size:13px}
  .lb .gainpill + b{margin-left:12px}
  .lb li.me{color:var(--ink)}
  .lb li:not(.me){color:var(--dim)}
  .lb.final li{padding:14px 2px}
  .lb.final li:first-child{color:var(--ink)}
  .lb.final li:first-child .nm{font-size:19px}
  .lb.final li:first-child b{font-size:20px}
  .lb.final .rank{width:26px;font-size:15px}
  .lb.final .det{font-size:12px;letter-spacing:.06em}
  .waitmsg{margin:22px 0 0;font-weight:700;text-align:center}
  .answerRow{display:flex;justify-content:center;margin:6px 0 12px}
  #choices2{display:grid;gap:10px;margin-top:20px}
  #typed2{margin-top:20px}
  #typedInput2{width:100%;background:var(--card2);color:var(--ink);border:1px solid var(--line);
    border-radius:11px;padding:16px 14px;font-size:19px;font-weight:700;text-align:center;font-family:inherit}
  #typedSubmit2{margin-top:10px}
  #bar2{height:100%;background:var(--accent);width:100%}
  #answeredLine{margin-top:18px}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="fr" aria-pressed="false">FR</button>
    </div>
  </div>

  <!-- HOME -->
  <section id="home" class="screen on">
    <h1><small id="eyebrowTitle2">Le jeu du métro</small>Correspondance</h1>
    <p class="lede" id="lede2"></p>
    <div class="linestrip" id="strip"></div>
    <div class="choices2">
      <button id="homeSolo" class="bigopt"></button>
      <button id="homeLive" class="bigopt"></button>
      <button id="homeCross" class="bigopt"></button>
    </div>
    <p style="text-align:center;margin-top:18px"><button class="ghost" data-sheet></button></p>
    <p class="foot" id="foot2"></p>
  </section>

  <!-- ONLINE: create or join -->
  <section id="online" class="screen">
    <p><button class="ghost" id="onlineBack"></button></p>
    <div class="card">
      <label for="myName" id="lblYourName"></label>
      <input id="myName" type="text" autocomplete="off" maxlength="18">
    </div>
    <div id="onlineFlow">
      <div id="createBlock">
        <button id="createBtn" class="primary"></button>
        <div class="orline"><span>—</span></div>
      </div>
      <div id="joinBlock" class="card">
        <label for="roomCode" id="lblJoinCode"></label>
        <div class="rowin">
          <input id="roomCode" type="text" autocomplete="off" maxlength="4"
                 autocapitalize="characters" spellcheck="false" style="text-transform:uppercase;letter-spacing:.2em;font-weight:800">
          <button id="joinBtn"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- CROSSWORD -->
  <section id="cross" class="screen">
    <p><button class="ghost" id="crossBack"></button></p>
    <h1><small id="crossEyebrow">Le jeu du métro</small><span id="crossTitle"></span></h1>
    <p class="lede" id="crossHint"></p>
    <div class="shapes" role="group">
      <button data-mode="mini" id="crossMiniBtn" aria-pressed="true"></button>
      <button data-mode="full" id="crossFullBtn" aria-pressed="false"></button>
    </div>
    <p class="dimtext center" id="crossShapeNote"></p>
    <p class="crossmsg" id="crossMsg"></p>
    <div class="gridwrap"><div id="crossGrid"></div></div>
    <input id="crossInput" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="characters" spellcheck="false" aria-label="Crossword letters">
    <p id="crossCurrent" class="curclue"></p>
    <div class="crossbtns">
      <button id="crossHintBtn"></button>
      <button id="crossCheckBtn"></button>
      <button id="crossRevealBtn"></button>
      <button id="crossNewBtn"></button>
    </div>
    <div class="card">
      <div class="eyebrow" id="crossAcrossLbl"></div>
      <ul class="clues" id="crossAcross"></ul>
    </div>
    <div class="card">
      <div class="eyebrow" id="crossDownLbl"></div>
      <ul class="clues" id="crossDown"></ul>
    </div>
  </section>

  <!-- LIVE ROOM -->
  <section id="live" class="screen"><div id="liveBody"></div></section>

  <!-- SETUP (pass-the-phone) -->
  <section id="setup" class="screen">
    <p><button class="ghost" id="homeBackFromSetup"></button></p>
    <h1><small id="eyebrowTitle">Le jeu du métro</small>Correspondance</h1>
    <p class="lede" id="lede"></p>

    <div class="card">
      <label for="pname" id="lblPlayers"></label>
      <div class="rowin">
        <input id="pname" type="text" autocomplete="off" maxlength="18">
        <button id="add"></button>
      </div>
      <ul id="players"></ul>
    </div>

    <div class="card">
      <div class="grid2" style="margin-top:0">
        <div>
          <label for="rounds" id="lblRounds"></label>
          <select id="rounds"><option>3</option><option selected>5</option><option>8</option><option>12</option></select>
        </div>
        <div>
          <label for="speed" id="lblSpeed"></label>
          <select id="speed"><option>15</option><option selected>25</option><option>40</option><option>90</option></select>
        </div>
      </div>
      <div class="stack">
        <label for="mode" id="lblMode"></label>
        <select id="mode">
          <option value="mc"></option>
          <option value="mixed" selected></option>
          <option value="typed"></option>
        </select>
        <p id="modeNote" style="color:var(--dim);font-size:13px;margin:8px 0 0"></p>
      </div>
    </div>

    <button id="start" class="primary" disabled></button>
    <p id="hint"></p>
    <p style="text-align:center;margin-top:18px"><button class="ghost" data-sheet></button></p>

    <p class="foot" id="foot"></p>
  </section>

  <!-- PASS -->
  <section id="pass" class="screen">
    <div class="card">
      <div class="eyebrow" id="passEyebrow"></div>
      <span id="passChip" class="passchip"></span>
      <div id="passName">—</div>
      <div id="passMeta"></div>
      <button id="ready" class="primary"></button>
    </div>
  </section>

  <!-- QUESTION -->
  <section id="question" class="screen">
    <div class="card">
      <div class="qhead">
        <b id="qWho"></b><span id="qKind"></span><span class="tag" id="qMode"></span>
        <span id="qRound"></span><span id="clock"></span>
      </div>
      <div class="track"><div id="bar"></div></div>
      <p id="qText"></p>
      <p id="qNote"></p>
      <div id="choices"></div>
      <div id="typed" hidden>
        <input id="typedInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="typedSubmit" class="primary"></button>
        <button id="typedGiveUp" class="ghost"></button>
      </div>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen">
    <div class="card">
      <p id="verdict" class="verdict"></p>
      <p id="explain"></p>
      <p id="gain"></p>
    </div>
    <div class="card">
      <div class="eyebrow" id="standingsLabel" style="margin-bottom:6px"></div>
      <ul id="standings"></ul>
    </div>
    <button id="next" class="primary"></button>
  </section>

  <!-- FINAL -->
  <section id="final" class="screen">
    <div class="card">
      <div class="eyebrow" id="finalEyebrow"></div>
      <div id="winner"></div>
      <ul id="podium"></ul>
    </div>
    <button id="again" class="primary"></button>
    <p style="text-align:center;margin-top:18px"><button class="ghost" data-sheet></button></p>
  </section>
</div>

<!-- CHEAT SHEET -->
<div id="modal">
  <div class="sheetbox">
    <h2 id="sheetTitle"></h2>
    <p id="sheetSub" style="color:var(--dim);font-size:14px;margin:0 0 12px"></p>
    <div id="sheet"></div>
    <button id="closeSheet" class="primary" style="margin-top:18px"></button>
  </div>
</div>

<script src="data.js"></script>
<script src="config.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>
<script src="live.js"></script>
<script src="crossword.js"></script>
</body>
</html>
