<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Correspondance — the Paris Métro guessing game</title>
<meta name="description" content="A pass-the-phone Paris Métro guessing game for 3 to 8 players. Lines, landmarks, termini and station counts, in English or French.">
<style>
  /* Light is the default here: a signage-white page, navy ink, one hot accent. */
  :root{
    --bg:#eef1f6; --card:#ffffff; --card2:#f3f6fa; --line:#dde3ec;
    --ink:#0b1524; --dim:#5b6678; --good:#0f7a37; --bad:#c62828;
    --accent:#e32017; --onAccent:#ffffff;
    --fill:#0b1524; --onFill:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b1017; --card:#151c26; --card2:#1c2430; --line:#2a3441;
           --ink:#eef2f8; --dim:#93a1b4; --good:#3fb950; --bad:#f2564a;
           --accent:#ff4a3d; --onAccent:#ffffff;
           --fill:#212c3b; --onFill:#ffffff; }
  }
  /* the viewer's own theme toggle must beat the OS preference, both ways */
  :root[data-theme=light]{ --bg:#eef1f6; --card:#ffffff; --card2:#f3f6fa; --line:#dde3ec;
    --ink:#0b1524; --dim:#5b6678; --good:#0f7a37; --bad:#c62828;
    --accent:#e32017; --onAccent:#ffffff; --fill:#0b1524; --onFill:#ffffff; }
  :root[data-theme=dark]{ --bg:#0b1017; --card:#151c26; --card2:#1c2430; --line:#2a3441;
    --ink:#eef2f8; --dim:#93a1b4; --good:#3fb950; --bad:#f2564a;
    --accent:#ff4a3d; --onAccent:#ffffff; --fill:#212c3b; --onFill:#ffffff; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px}
  /* Display type: heavy, uppercase, tightly tracked — station-sign voice.
     font-stretch narrows it where the platform's UI font is variable. */
  h1{font-size:clamp(30px,9vw,46px);margin:0;font-weight:900;line-height:1;
    text-transform:uppercase;letter-spacing:.01em;font-stretch:condensed;text-wrap:balance}
  h1 small{display:block;font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.18em;
    text-transform:uppercase;margin-bottom:8px;font-stretch:normal}
  /* the 16 lines, in order, as a signature rule — drawn from the real palette */
  .linestrip{display:flex;height:7px;border-radius:4px;overflow:hidden;margin:18px 0 4px}
  .linestrip i{flex:1}
  .screen{display:none} .screen.on{display:block;animation:in .25s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    .screen.on{animation:none}
    button:active{transform:none}
  }
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .bullet{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;
    font-weight:800;font-size:13px;flex:0 0 auto;letter-spacing:-.02em}
  .bullet.big{width:52px;height:52px;font-size:22px}
  .swatch{display:inline-block;width:1.9em;height:.65em;border-radius:3px;vertical-align:baseline}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}
  .lede{color:var(--dim);margin:14px 0 0}
  label{display:block;font-size:13px;font-weight:600;color:var(--dim);margin:0 0 6px}
  input[type=text],select{width:100%;background:var(--card2);color:var(--ink);
    border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:16px;font-family:inherit}
  .rowin{display:flex;gap:8px}
  .rowin input{flex:1}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .stack{margin-top:14px}

  button{font:inherit;font-weight:700;cursor:pointer;border-radius:11px;
    background:var(--card2);color:var(--ink);border:1px solid var(--line);padding:13px 16px;
    min-height:46px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none}
  button:active{transform:scale(.985)}
  /* 16px is the threshold below which iOS zooms the page on focus */
  input[type=text]{font-size:16px;min-height:46px}
  .primary{background:var(--accent);color:var(--onAccent);border-color:transparent;width:100%;
    padding:17px;font-size:15px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;
    border-radius:13px}
  .primary:disabled{opacity:.32;cursor:not-allowed}
  .ghost{background:transparent;color:var(--dim);border-color:transparent;text-decoration:underline;
    text-underline-offset:3px}

  /* language toggle */
  .topbar{display:flex;justify-content:flex-end;margin-bottom:10px}
  .langs{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .langs button{border:0;border-radius:0;background:transparent;color:var(--dim);
    padding:7px 14px;font-size:13px;letter-spacing:.05em}
  .langs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
  .langs button{min-height:34px}

  ul{list-style:none;margin:0;padding:0}
  #players li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);font-weight:600}
  #players li:last-child{border:0}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  .x{margin-left:auto;background:transparent;border:0;color:var(--dim);font-size:20px;padding:2px 8px;line-height:1}
  #hint{color:var(--dim);font-size:14px;margin:12px 0 0;text-align:center}

  #pass .card{text-align:center;padding:56px 20px}
  #passName{font-size:clamp(30px,9vw,44px);font-weight:800;margin:10px 0 4px;letter-spacing:-.02em}
  #passMeta{color:var(--dim);font-size:14px;margin-bottom:26px}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}

  .qhead{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);font-weight:600;flex-wrap:wrap}
  .qhead b{font-weight:800;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
  .passchip{display:block;width:44px;height:6px;border-radius:3px;margin:14px auto 0}
  #clock{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink)}
  .tag{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11px;
    letter-spacing:.08em;text-transform:uppercase}
  .track{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 18px}
  #bar{height:100%;background:var(--accent);width:100%}
  #qText{font-size:clamp(20px,5vw,26px);font-weight:700;line-height:1.3;letter-spacing:-.01em;margin:0}
  #qText em{font-style:normal;border-bottom:2px solid var(--accent);padding-bottom:1px}
  #qNote{color:var(--dim);font-size:14px;margin:10px 0 0}
  #choices{display:grid;gap:10px;margin-top:20px}
  /* bullets and numbers pair up two-per-row so all four fit without scrolling */
  #choices.twoup,#choices2.twoup{grid-template-columns:1fr 1fr}
  .choice{display:flex;align-items:center;justify-content:center;gap:10px;min-height:66px;
    background:var(--card);padding:12px}
  .choice .num{font-size:24px;font-weight:800}
  .choice .stn{font-size:17px;font-weight:700;text-align:center}
  .choice.right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
  .choice.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
  .choice:disabled{cursor:default;opacity:1}
  #typed{margin-top:20px}
  #typedInput{font-size:19px;font-weight:700;padding:16px 14px;text-align:center}
  #typedSubmit{margin-top:10px}
  #typedGiveUp{display:block;margin:10px auto 0}

  .verdict{font-size:28px;font-weight:800;margin:0 0 8px;letter-spacing:-.02em}
  .verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
  #explain{margin:0 0 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  #gain{font-weight:800;font-size:18px}
  #gain .sub{font-weight:500;color:var(--dim);font-size:14px}
  #standings li{display:flex;align-items:center;gap:10px;padding:9px 2px;font-size:15px;color:var(--dim)}
  #standings li.me{color:var(--ink);font-weight:700}
  #standings b{margin-left:auto;font-variant-numeric:tabular-nums}

  #winner{font-size:clamp(26px,7vw,36px);font-weight:800;letter-spacing:-.02em;margin:6px 0 18px}
  #podium li{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line)}
  #podium li:last-child{border:0}
  .rank{width:24px;font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums}
  .nm{font-weight:700}
  .det{margin-left:auto;color:var(--dim);font-size:13px}
  #podium b{width:64px;text-align:right;font-variant-numeric:tabular-nums;font-size:18px}

  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:9}
  #modal.on{display:flex}
  .sheetbox{background:var(--card);width:100%;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;
    padding:20px 16px calc(20px + env(safe-area-inset-bottom));margin:0 auto;max-width:640px}
  @media(min-width:641px){#modal{align-items:center}.sheetbox{border-radius:18px;max-height:80vh}}
  .sheetbox h2{margin:0 0 4px;font-size:20px}
  #sheet .row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  #sheet .row:last-child{border:0}
  .tm{font-weight:650;font-size:15px;line-height:1.35}
  .ct{color:var(--dim);font-size:13px}
  .foot{color:var(--dim);font-size:12px;text-align:center;margin-top:26px;line-height:1.6}

  /* crossword */
  .gridwrap{display:flex;justify-content:center;margin:14px 0 10px;overflow-x:auto}
  #crossGrid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:2px;
    width:100%;max-width:min(100%,var(--cols)*40px)}
  .xc{position:relative;aspect-ratio:1;background:var(--card);border:1px solid var(--line);
    border-radius:3px;display:grid;place-items:center;font-weight:800;
    font-size:clamp(11px,3.4vw,19px);text-transform:uppercase;cursor:pointer;
    -webkit-user-select:none;user-select:none;touch-action:manipulation}
  .xc.block{background:transparent;border-color:transparent;cursor:default}
  .xc b{position:absolute;top:1px;left:2px;font-size:8px;font-weight:700;color:var(--dim);line-height:1}
  .xc.inword{background:color-mix(in srgb,var(--accent) 11%,var(--card))}
  .xc.here{outline:2px solid var(--accent);outline-offset:-2px;
    background:color-mix(in srgb,var(--accent) 22%,var(--card))}
  /* letters you were handed, not ones you worked out */
  .xc.given{color:var(--accent)}
  .xc.ok{color:var(--good)}
  .xc.no{color:var(--bad);text-decoration:line-through}
  /* offscreen, but focusable — this is what opens the phone keyboard */
  #crossInput{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;min-height:0}
  .curclue{text-align:center;font-weight:700;margin:4px 0 14px;min-height:1.5em}
  .shapes{display:flex;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;
    margin:16px auto 8px;width:fit-content;background:var(--card)}
  .shapes button{border:0;border-radius:0;background:transparent;color:var(--dim);
    padding:9px 20px;font-size:14px;min-height:42px}
  .shapes button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
  .crossbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(min-width:520px){.crossbtns{grid-template-columns:repeat(4,1fr)}}
  .crossbtns button{font-size:13px;padding:12px 6px}
  .crossmsg{text-align:center;font-weight:700;margin:6px 0 0;min-height:1.4em}
  .crossmsg.good{color:var(--good)} .crossmsg.bad{color:var(--bad)}
  .clues li{display:flex;gap:10px;padding:9px 2px;font-size:14px;line-height:1.4;cursor:pointer;
    border-bottom:1px solid var(--line);color:var(--dim)}
  .clues li:last-child{border:0}
  .clues li.on{color:var(--ink);font-weight:600}
  .clues .n{font-weight:800;color:var(--ink);min-width:18px;font-variant-numeric:tabular-nums}
  .clues .len{color:var(--dim);font-weight:500}

  /* A question must fit on one screen — nobody should scroll to find option 4
     while the clock is running. These tighten as the screen gets shorter. */
  @media (max-height: 780px){
    .wrap{padding-top:12px;padding-bottom:20px}
    .topbar{margin-bottom:6px}
    .card{padding:15px}
    .choice{min-height:54px}
    #choices,#choices2{gap:8px;margin-top:14px}
    .bullet.big{width:44px;height:44px;font-size:19px}
    .track{margin:8px 0 13px}
    #qText{font-size:20px}
    #qNote{margin-top:7px;font-size:13px}
    #answeredLine{margin-top:12px;font-size:13px}
  }
  @media (max-height: 660px){
    .card{padding:12px}
    .choice{min-height:48px}
    #choices,#choices2{gap:6px;margin-top:11px}
    .bullet.big{width:38px;height:38px;font-size:17px}
    .choice .stn{font-size:15px}
    .choice .num{font-size:21px}
    #qText{font-size:18px}
    .qhead{font-size:12px;gap:7px}
    #typedInput,#typedInput2{padding:12px;font-size:17px}
  }

  /* home + live rooms */
  /* The two ways to play, as the page's main event: one filled, one outlined,
     each with a coloured rail down its left edge. */
  .choices2{display:grid;gap:12px;margin-top:20px}
  .bigopt{display:block;text-align:left;padding:19px 20px;background:var(--card);
    border:1px solid var(--line);border-radius:16px;border-left:7px solid var(--accent)}
  .bigopt .opt{display:block;font-size:19px;font-weight:900;text-transform:uppercase;
    letter-spacing:.02em;font-stretch:condensed}
  .bigopt .optsub{display:block;color:var(--dim);font-weight:500;font-size:14px;margin-top:5px;
    text-transform:none;letter-spacing:0}
  #homeSolo{background:var(--fill);color:var(--onFill);border-color:transparent;
    border-left:7px solid #FFCE00}
  #homeSolo .optsub{color:rgba(255,255,255,.66)}
  .orline{text-align:center;color:var(--dim);margin:6px 0}
  #onlineFlow{display:flex;flex-direction:column}
  #createBlock{order:1} #joinBlock{order:2}
  /* arriving from a shared link: joining is the point, hosting is the afterthought */
  #online.invited #joinBlock{order:1;margin-top:0}
  #online.invited #createBlock{order:2;margin-top:18px}
  #online.invited #createBtn{background:transparent;color:var(--dim);border:1px solid var(--line)}
  #online.invited .orline{display:none}
  #online.invited #joinBtn{background:var(--accent);color:#000;border-color:transparent}
  .center{text-align:center}
  .dimtext{color:var(--dim);font-size:14px}
  .notice{background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid var(--accent);
    border-radius:11px;padding:10px 14px;font-size:14px;font-weight:600;margin:0 0 14px}
  .code{font-size:clamp(44px,15vw,72px);font-weight:800;letter-spacing:.18em;margin:6px 0 10px;
    font-variant-numeric:tabular-nums}
  #roomLink{margin:14px 0 10px;text-align:center;font-size:16px;color:var(--dim);
    text-overflow:ellipsis;cursor:text}
  .lobbybtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .hostbanner{display:flex;flex-direction:column;gap:3px;background:color-mix(in srgb,var(--accent) 15%,transparent);
    border:1px solid var(--accent);border-radius:14px;padding:13px 16px;margin-bottom:4px}
  .localwarn{display:flex;flex-direction:column;gap:6px;align-items:flex-start;
    background:color-mix(in srgb,var(--bad) 14%,transparent);border:1px solid var(--bad);
    border-radius:14px;padding:14px 16px;margin-bottom:4px}
  .localwarn strong{font-size:15px}
  .localwarn span{color:var(--dim);font-size:13px;line-height:1.45}
  .localwarn .gobtn{display:inline-flex;align-items:center;min-height:46px;margin-top:4px;
    background:var(--accent);color:#000;text-decoration:none;font-weight:700;font-size:15px;
    padding:0 16px;border-radius:10px;touch-action:manipulation}
  .hostbanner strong{font-size:15px}
  .hostbanner span{color:var(--dim);font-size:13px;line-height:1.45}
  .lb li{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:15px}
  .lb li:last-child{border:0}
  .lb .nm{font-weight:700}
  .lb .det{margin-left:auto;color:var(--dim);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
  .lb b{margin-left:auto;font-variant-numeric:tabular-nums;font-size:17px}
  .lb .gainpill{margin-left:auto;color:var(--good);font-weight:700;font-size:13px}
  .lb .gainpill + b{margin-left:12px}
  .lb li.me{color:var(--ink)}
  .lb li:not(.me){color:var(--dim)}
  .lb.final li{padding:14px 2px}
  .lb.final li:first-child{color:var(--ink)}
  .lb.final li:first-child .nm{font-size:19px}
  .lb.final li:first-child b{font-size:20px}
  .lb.final .rank{width:26px;font-size:15px}
  .lb.final .det{font-size:12px;letter-spacing:.06em}
  .waitmsg{margin:22px 0 0;font-weight:700;text-align:center}
  .answerRow{display:flex;justify-content:center;margin:6px 0 12px}
  #choices2{display:grid;gap:10px;margin-top:20px}
  #typed2{margin-top:20px}
  #typedInput2{width:100%;background:var(--card2);color:var(--ink);border:1px solid var(--line);
    border-radius:11px;padding:16px 14px;font-size:19px;font-weight:700;text-align:center;font-family:inherit}
  #typedSubmit2{margin-top:10px}
  #bar2{height:100%;background:var(--accent);width:100%}
  #answeredLine{margin-top:18px}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="fr" aria-pressed="false">FR</button>
    </div>
  </div>

  <!-- HOME -->
  <section id="home" class="screen on">
    <h1><small id="eyebrowTitle2">Le jeu du métro</small>Correspondance</h1>
    <p class="lede" id="lede2"></p>
    <div class="linestrip" id="strip"></div>
    <div class="choices2">
      <button id="homeSolo" class="bigopt"></button>
      <button id="homeLive" class="bigopt"></button>
      <button id="homeCross" class="bigopt"></button>
    </div>
    <p style="text-align:center;margin-top:18px"><button class="ghost" data-sheet></button></p>
    <p class="foot" id="foot2"></p>
  </section>

  <!-- ONLINE: create or join -->
  <section id="online" class="screen">
    <p><button class="ghost" id="onlineBack"></button></p>
    <div class="card">
      <label for="myName" id="lblYourName"></label>
      <input id="myName" type="text" autocomplete="off" maxlength="18">
    </div>
    <div id="onlineFlow">
      <div id="createBlock">
        <button id="createBtn" class="primary"></button>
        <div class="orline"><span>—</span></div>
      </div>
      <div id="joinBlock" class="card">
        <label for="roomCode" id="lblJoinCode"></label>
        <div class="rowin">
          <input id="roomCode" type="text" autocomplete="off" maxlength="4"
                 autocapitalize="characters" spellcheck="false" style="text-transform:uppercase;letter-spacing:.2em;font-weight:800">
          <button id="joinBtn"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- CROSSWORD -->
  <section id="cross" class="screen">
    <p><button class="ghost" id="crossBack"></button></p>
    <h1><small id="crossEyebrow">Le jeu du métro</small><span id="crossTitle"></span></h1>
    <p class="lede" id="crossHint"></p>
    <div class="shapes" role="group">
      <button data-mode="mini" id="crossMiniBtn" aria-pressed="true"></button>
      <button data-mode="full" id="crossFullBtn" aria-pressed="false"></button>
    </div>
    <p class="dimtext center" id="crossShapeNote"></p>
    <p class="crossmsg" id="crossMsg"></p>
    <div class="gridwrap"><div id="crossGrid"></div></div>
    <input id="crossInput" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="characters" spellcheck="false" aria-label="Crossword letters">
    <p id="crossCurrent" class="curclue"></p>
    <div class="crossbtns">
      <button id="crossHintBtn"></button>
      <button id="crossCheckBtn"></button>
      <button id="crossRevealBtn"></button>
      <button id="crossNewBtn"></button>
    </div>
    <div class="card">
      <div class="eyebrow" id="crossAcrossLbl"></div>
      <ul class="clues" id="crossAcross"></ul>
    </div>
    <div class="card">
      <div class="eyebrow" id="crossDownLbl"></div>
      <ul class="clues" id="crossDown"></ul>
    </div>
  </section>

  <!-- LIVE ROOM -->
  <section id="live" class="screen"><div id="liveBody"></div></section>

  <!-- SETUP (pass-the-phone) -->
  <section id="setup" class="screen">
    <p><button class="ghost" id="homeBackFromSetup"></button></p>

/* Minimal Supabase Realtime client — broadcast only.
   Speaks the Phoenix channel protocol directly over a WebSocket so the game
   stays dependency-free and keeps working as a single inlined file. */

function joinRoom(code, handlers) {
  const topic = 'realtime:metro-' + code;
  const url = `wss://${SUPABASE_REF}.supabase.co/realtime/v1/websocket`
    + `?apikey=${encodeURIComponent(SUPABASE_ANON_KEY)}&vsn=1.0.0`;

  let ws = null, ref = 0, beat = null, retry = 0, closed = false, joined = false;
  let everJoined = false, failures = 0;
  const queue = [];

  const nextRef = () => String(++ref);

  function push(msg) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
    else queue.push(msg);
  }

  function connect() {
    if (closed) return;
    joined = false;
    ws = new WebSocket(url);

    ws.onopen = () => {
      push({
        topic, event: 'phx_join', ref: nextRef(),
        payload: { config: { broadcast: { self: false, ack: false }, presence: { key: '' }, private: false } }
      });
      clearInterval(beat);
      beat = setInterval(() => push({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: nextRef() }), 25000);
    };

    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (_) { return; }

      if (m.event === 'phx_reply' && m.topic === topic) {
        if (m.payload && m.payload.status === 'ok') {
          if (!joined) {
            joined = true; everJoined = true; retry = 0; failures = 0;
            while (queue.length) ws.send(JSON.stringify(queue.shift()));
            handlers.onOpen && handlers.onOpen();
          }
        } else if (!joined) {
          handlers.onError && handlers.onError('join refused');
        }
        return;
      }
      if (m.event === 'broadcast' && m.payload && m.payload.type === 'broadcast') {
        handlers.onMessage && handlers.onMessage(m.payload.event, m.payload.payload || {});
      }
    };

    ws.onclose = () => {
      clearInterval(beat);
      if (closed) return;
      /* never connected at all — no network, or a page CSP that blocks wss */
      if (!everJoined && ++failures >= 3) {
        closed = true;
        handlers.onUnreachable && handlers.onUnreachable();
        return;
      }
      handlers.onDrop && handlers.onDrop();
      retry = Math.min(retry + 1, 6);
      setTimeout(connect, 400 * retry * retry);   // 0.4s, 1.6s, 3.6s … capped
    };

    ws.onerror = () => { try { ws.close(); } catch (_) {} };
  }

  connect();

  return {
    send(event, payload) {
      push({ topic, event: 'broadcast', ref: nextRef(), payload: { type: 'broadcast', event, payload } });
    },
    get live() { return joined; },
    close() { closed = true; clearInterval(beat); try { ws && ws.close(); } catch (_) {} }
  };
}

/* ————— fuzzy answer matching ————— */
const strip = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const norm = s => strip(String(s)).toLowerCase()
  .replace(/\bst\b/g, 'saint')
  .replace(/[^a-z0-9]+/g, '');

function lev(a, b) {
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 3) return 9;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

/* station / free text: forgiving */
const matchesText = accept => raw => {
  const v = norm(raw);
  if (!v) return false;
  return accept.some(a => {
    const w = norm(a);
    return v === w || lev(v, w) <= (w.length <= 7 ? 1 : w.length <= 14 ? 2 : 3);
  });
};

/* line ids: "12", "ligne 12", "line 12", "3 bis", "L3bis" */
const matchesLine = ids => raw => {
  let v = norm(raw).replace(/^(ligne|line|l)/, '');
  return ids.includes(v);
};

const matchesNumber = n => raw => {
  const m = String(raw).match(/-?\d+/);
  return !!m && +m[0] === n;
};

/* ————— question generators —————
   { kind, prompt, note, choices[], answer, explain, typed?:{ph, check, note} } */

function qLandmark() {
  const [en, fr, station, line] = rnd(LANDMARKS);
  const place = esc(LANG === 'fr' ? fr : en);
  const served = STATIONS[station];
  const wrong = sample(LINE_IDS.filter(l => !served.includes(l)), 3);
  const opts = shuffle([line, ...wrong]);
  return {
    kind: 'landmark',
    prompt: t('qLandmark')(place),
    note: t('nLandmark'),
    choices: opts.map(l => bullet(l, 'big')),
    answer: opts.indexOf(line),
    explain: t('xLandmark')(place, esc(station), line),
    typed: { ph: 'typedPhLine', check: matchesLine(served), note: t('nLandmark') }
  };
}

function qStationLine() {
  const st = rnd(STATION_NAMES);
  const served = STATIONS[st];
  const line = rnd(served);
  const wrong = sample(LINE_IDS.filter(l => !served.includes(l)), 3);
  const opts = shuffle([line, ...wrong]);
  return {
    kind: 'station',
    prompt: t('qStation')(esc(st)),
    note: served.length > 1 ? t('nStationMc')(served.length) : null,
    choices: opts.map(l => bullet(l, 'big')),
    answer: opts.indexOf(line),
    explain: `${t('xStation')(esc(st))} ${bullets(served)}`,
    typed: { ph: 'typedPhLine', check: matchesLine(served), note: served.length > 1 ? t('nStationTyped') : null }
  };
}

function qCount() {
  const id = rnd(LINE_IDS.filter(l => LINES[l].count > 8));
  const n = LINES[id].count;
  const set = new Set([n]);
  while (set.size < 4) {
    const d = n + (Math.random() < .5 ? -1 : 1) * (1 + Math.floor(Math.random() * 6));
    if (d > 2) set.add(d);
  }
  const opts = shuffle([...set]);
  return {
    kind: 'count',
    prompt: t('qCount')(id),
    note: ends(id),
    choices: opts.map(v => `<span class="num">${v}</span>`),
    answer: opts.indexOf(n),
    explain: t('xCount')(id, n),
    typed: { ph: 'typedPhNumber', check: matchesNumber(n), note: ends(id) }
  };
}

function qTerminus() {
  const term = rnd(Object.keys(TERMINI));
  const line = rnd(TERMINI[term]);
  const wrong = sample(LINE_IDS.filter(l => !TERMINI[term].includes(l)), 3);
  const opts = shuffle([line, ...wrong]);
  return {
    kind: 'terminus',
    prompt: t('qTerminus')(esc(term)),
    note: TERMINI[term].length > 1 ? t('nTerminus') : null,
    choices: opts.map(l => bullet(l, 'big')),
    answer: opts.indexOf(line),
    explain: `${t('xTerminus')(esc(term))} ${bullets(TERMINI[term])}`,
    typed: { ph: 'typedPhLine', check: matchesLine(TERMINI[term]), note: null }
  };
}

/* multiple choice only — there is no single typed answer for "the odd one" */
function qOddOne() {
  const id = rnd(LINE_IDS.filter(l => stationsOn(l).length >= 6));
  const on = sample(stationsOn(id), 3);
  const off = rnd(STATION_NAMES.filter(n => !STATIONS[n].includes(id)));
  const opts = shuffle([...on, off]);
  return {
    kind: 'odd',
    prompt: t('qOdd')(id),
    note: null,
    choices: opts.map(n => `<span class="stn">${esc(n)}</span>`),
    answer: opts.indexOf(off),
    explain: `${t('xOdd')(esc(off), id)} ${bullets(STATIONS[off])}`
  };
}

function qInterchange() {
  const hub = rnd(STATION_NAMES.filter(n => STATIONS[n].length >= 2));
  const [a, b] = sample(STATIONS[hub], 2);
  const wrong = sample(STATION_NAMES.filter(n => !(STATIONS[n].includes(a) && STATIONS[n].includes(b))), 3);
  const opts = shuffle([hub, ...wrong]);
  /* other stations serving both lines are equally correct when typed */
  const alsoRight = STATION_NAMES.filter(n => STATIONS[n].includes(a) && STATIONS[n].includes(b));
  return {
    kind: 'hub',
    prompt: t('qHub')(bullet(a), bullet(b)),
    note: null,
    choices: opts.map(n => `<span class="stn">${esc(n)}</span>`),
    answer: opts.indexOf(hub),
    explain: `<strong>${esc(hub)}</strong> — ${bullets(STATIONS[hub])}`,
    typed: { ph: 'typedPhStation', check: matchesText(alsoRight), note: t('nHubTyped') }
  };
}

function qColour() {
  const pool = LINE_IDS.filter(l => l !== '7bis'); // 6 and 7bis share a green
  const id = rnd(pool);
  const wrong = sample(pool.filter(l => l !== id), 3);
  const opts = shuffle([id, ...wrong]);
  const sw = `<span class="swatch" style="background:${LINES[id].color}"></span>`;
  const same = LINE_IDS.filter(l => LINES[l].color === LINES[id].color);
  return {
    kind: 'colour',
    prompt: t('qColour')(sw),
    note: null,
    choices: opts.map(l => `<span class="num">${l}</span>`),
    answer: opts.indexOf(id),
    explain: t('xColour')(id, ends(id)),
    typed: { ph: 'typedPhLine', check: matchesLine(same), note: null }
  };
}

const GENERATORS = [qLandmark, qStationLine, qCount, qTerminus, qOddOne, qInterchange, qColour];

function nextQuestion() {
  const typed = G.mode === 'typed' || (G.mode === 'mixed' && Math.random() < .5);
  const pool = typed ? TYPED_GENERATORS : GENERATORS;
  for (let i = 0; i < 40; i++) {
    const q = rnd(pool)();
    const key = q.kind + '|' + q.prompt;
    if (!G.seen.has(key)) { G.seen.add(key); G.isTyped = typed || !!q.typedOnly; return q; }
  }
  const q = rnd(pool)();
  G.isTyped = typed || !!q.typedOnly;
  return q;
}

function addPlayer() {
  const name = $('#pname').value.trim();

  G.players.push({ name, score: 0, correct: 0, color: PALETTE[G.players.length % PALETTE.length] });

  G.round = 0; G.turn = 0; G.seen.clear();

  G.seconds = +$('#speed').value;

  const p = G.players[G.turn];

  $('#passName').textContent = p.name;
  $('#passChip').style.background = p.color;
  $('#passMeta').textContent = `${t('roundOf')(G.round + 1, G.rounds)} · ${t('pts')(p.score)}`;
  show('pass');

function askQuestion() {

  G.left = G.seconds;

  $('#qWho').innerHTML = `<span class="dot" style="background:${p.color}"></span>${esc(p.name)}`;
  $('#qKind').textContent = t('kinds')[G.q.kind];
  $('#qMode').textContent = G.isTyped ? t('tagTyped') : t('tagMc');
  $('#qRound').textContent = t('roundShort')(G.round + 1, G.rounds);
  $('#qText').innerHTML = G.q.prompt;

  const note = G.isTyped ? G.q.typed.note : G.q.note;
  $('#qNote').innerHTML = note || '';
  $('#qNote').style.display = note ? '' : 'none';

  if (G.isTyped) {
    $('#choices').innerHTML = '';
    $('#typed').hidden = false;
    $('#typedInput').value = '';
    $('#typedInput').placeholder = t(G.q.typed.ph);
    $('#typedInput').disabled = false;
    $('#typedSubmit').disabled = false;
  } else {
    $('#typed').hidden = true;
    $('#choices').className = SHORT_CHOICES.includes(G.q.kind) ? 'twoup' : '';
    $('#choices').innerHTML = G.q.choices.map((c, i) =>
      `<button class="choice" data-i="${i}">${c}</button>`).join('');
  }

  $('#bar').style.transition = 'none';
  $('#bar').style.width = '100%';
  show('question');
  requestAnimationFrame(() => {
    $('#bar').style.transition = `width ${G.seconds}s linear`;
    $('#bar').style.width = '0%';
  });
  if (G.isTyped) $('#typedInput').focus();

  clearInterval(G.timer);
  $('#clock').textContent = G.left;
  G.timer = setInterval(() => {
    G.left--;
    $('#clock').textContent = Math.max(G.left, 0);
    if (G.left <= 0) resolve(false, true);
  }, 1000);
}

/* multiple choice */
function answer(i) {
  if (G.locked) return;
  const ok = i === G.q.answer;
  document.querySelectorAll('.choice').forEach((b, j) => {
    b.disabled = true;
    if (j === G.q.answer) b.classList.add('right');
    else if (j === i) b.classList.add('wrong');
  });
  resolve(ok, i === -1);
}

/* typed */
function submitTyped(gaveUp) {
  if (G.locked) return;
  const raw = $('#typedInput').value;
  const ok = !gaveUp && !!raw.trim() && G.q.typed.check(raw);
  $('#typedInput').disabled = true;
  $('#typedSubmit').disabled = true;
  resolve(ok, false);
}

function resolve(ok, timedOut) {
  if (G.locked) return;
  G.locked = true;
  clearInterval(G.timer);
  $('#bar').style.transition = 'none';

  const p = G.players[G.turn];
  const base = G.isTyped ? 150 : 100;
  const bonus = ok ? Math.round(50 * Math.max(G.left, 0) / G.seconds) : 0;
  const gained = ok ? base + bonus : 0;
  p.score += gained;
  if (ok) p.correct++;

  setTimeout(() => {
    $('#verdict').textContent = timedOut ? t('timeout') : ok ? t('good') : t('bad');
    $('#verdict').className = 'verdict ' + (ok ? 'good' : 'bad');
    let ex = G.q.explain;
    if (G.q.examples) ex += ` <span style="color:var(--dim)">${t('egAccepted')} ${G.q.examples.map(esc).join(', ')}.</span>`;
    $('#explain').innerHTML = ex;
    $('#gain').innerHTML = ok ? t('gain')(gained, base, bonus) : t('zero');
    $('#standings').innerHTML = G.players
      .map((pl, idx) => ({ pl, idx }))
      .sort((a, b) => b.pl.score - a.pl.score)
      .map(({ pl, idx }) => `<li${idx === G.turn ? ' class="me"' : ''}><span class="dot" style="background:${pl.color}"></span>${esc(pl.name)}<b>${pl.score}</b></li>`)
      .join('');
    show('result');
  }, G.isTyped ? 180 : 550);
}

function advance() {
  G.turn++;
  if (G.turn >= G.players.length) { G.turn = 0; G.round++; }
  if (G.round >= G.rounds) return finish();
  passScreen();
}

function finish() {
  const ranked = [...G.players].sort((a, b) => b.score - a.score);
  const top = ranked[0].score;
  const winners = ranked.filter(p => p.score === top);
  $('#winner').textContent = winners.length > 1
    ? t('tie')(winners.map(w => w.name).join(' & '))
    : t('wins')(ranked[0].name);
  $('#podium').innerHTML = ranked.map((p, i) =>
    `<li><span class="rank">${i + 1}</span><span class="dot" style="background:${p.color}"></span>
     <span class="nm">${esc(p.name)}</span>
     <span class="det">${t('right')(p.correct, G.rounds)}</span><b>${p.score}</b></li>`).join('');
  show('final');
}

const MAX_PLAYERS = 10;
const REVEAL_MS = 3200;

/* A room hosted from a dev copy hands out links nobody else can reach. */
const IS_LOCAL = location.protocol === 'file:'
  || ['localhost', '127.0.0.1', '::1', ''].includes(location.hostname);

const M = {
  net: null, code: '', isHost: false, me: { id: '', name: '' },
  phase: 'idle',            // idle | lobby | question | reveal | final | lost
  players: [],              // [{id,name,score,correct,host}]
  rounds: 8, seconds: 25, mode: 'mixed',
  qIndex: 0, q: null, qid: 0, qView: null,
  endsAt: 0, answers: {}, results: null, answeredCount: 0,
  myAnswer: null, tick: null, hostTimer: null, beat: null, watch: null,
  lastSync: 0, notice: ''
};

function myId() {
  let id = null;
  try { id = sessionStorage.getItem('corr.id'); } catch (e) { /* private mode */ }
  if (!id) {
    id = Math.random().toString(36).slice(2, 10);
    try { sessionStorage.setItem('corr.id', id); } catch (e) { /* private mode */ }
  }
  return id;
}

/* ————— connection ————— */
function connect(code, onOpen) {
  M.code = code;
  M.me.id = myId();
  M.net = joinRoom(code, {
    onOpen: () => {
      /* clear only connection chatter — keep messages like "back in your room" */
      if (M.notice === t('connecting') || M.notice === t('reconnecting')) M.notice = '';
      onOpen && onOpen();
      renderLive();
    },
    onDrop: () => { M.notice = t('reconnecting'); renderLive(); },
    onUnreachable: () => { M.net = null; M.phase = 'unreachable'; renderLive(); },
    onMessage: handleMessage
  });
}

function leaveRoom() {
  /* a host walking out ends the room — say so, don't leave players hanging */
  if (M.net) { M.net.send(M.isHost ? 'closed' : 'bye', { id: M.me.id }); M.net.close(); }
  clearInterval(M.tick); clearTimeout(M.hostTimer); clearInterval(M.beat); clearInterval(M.watch);
  M.net = null; M.phase = 'idle'; M.players = []; M.isHost = false;
  forgetRoom();
  show('home');
}

function handleMessage(event, p) {
  if (M.isHost) {
    if (event === 'hello') {
      const known = M.players.find(x => x.id === p.id);
      if (known) { known.lastSeen = Date.now(); return; }   /* just a heartbeat */
      if (M.players.length >= MAX_PLAYERS) { M.net.send('full', { id: p.id }); return; }
      M.players.push({
        id: p.id, name: String(p.name || '?').slice(0, 18),
        score: 0, correct: 0, host: false, lastSeen: Date.now()
      });
      broadcastSync();
      renderLive();
    } else if (event === 'answer') {
      takeAnswer(p);
    } else if (event === 'bye') {
      M.players = M.players.filter(x => x.id !== p.id);
      delete M.answers[p.id];
      broadcastSync(); renderLive();
      closeIfEveryoneAnswered();
    }
    return;
  }

  /* player side */
  if (event === 'sync') applySync(p);
  else if (event === 'reveal') applyReveal(p);
  else if (event === 'closed') { M.phase = 'lost'; M.notice = t('hostLeft'); renderLive(); }
  else if (event === 'full' && p.id === M.me.id) { M.notice = t('roomFull'); M.phase = 'idle'; renderLive(); show('online'); }
}

/* ————— host: broadcasting ————— */
function publicPlayers() {
  return M.players.map(p => ({ id: p.id, name: p.name, score: p.score, correct: p.correct, host: p.host }));
}

function broadcastSync() {
  if (!M.isHost || !M.net) return;
  M.net.send('sync', {
    phase: M.phase, players: publicPlayers(),
    qIndex: M.qIndex, rounds: M.rounds,
    q: M.qView, remaining: Math.max(0, M.endsAt - Date.now()),
    seconds: M.seconds, answeredCount: M.answeredCount
  });
}

function applySync(p) {
  M.lastSync = Date.now();
  const wasQid = M.qView && M.qView.qid;
  M.phase = p.phase; M.players = p.players || []; M.qIndex = p.qIndex;
  M.rounds = p.rounds; M.seconds = p.seconds; M.answeredCount = p.answeredCount || 0;
  M.qView = p.q || null;
  M.endsAt = Date.now() + (p.remaining || 0);
  if (M.qView && M.qView.qid !== wasQid) { M.myAnswer = null; M.results = null; }
  renderLive();
}

/* ————— host: the round loop ————— */
function startLive() {
  if (M.players.length < 2) return;
  M.rounds = +($('#lvRounds') || {}).value || 8;
  M.seconds = +($('#lvSpeed') || {}).value || 25;
  M.mode = ($('#lvMode') || {}).value || 'mixed';
  M.qIndex = 0;
  M.players.forEach(p => { p.score = 0; p.correct = 0; });
  G.seen.clear();
  askLive();
}

function askLive() {
  G.mode = M.mode;
  G.seconds = M.seconds;
  M.q = nextQuestion();
  M.qid = ++M.qIndex;
  M.answers = {}; M.answeredCount = 0; M.results = null; M.myAnswer = null;
  M.phase = 'question';
  M.endsAt = Date.now() + M.seconds * 1000;
  M.qView = {
    qid: M.qid, kind: M.q.kind, prompt: M.q.prompt,
    note: G.isTyped ? M.q.typed.note : M.q.note,
    choices: G.isTyped ? null : M.q.choices,
    isTyped: G.isTyped, ph: G.isTyped ? M.q.typed.ph : null
  };
  broadcastSync();
  renderLive();
  clearTimeout(M.hostTimer);
  M.hostTimer = setTimeout(closeQuestion, M.seconds * 1000 + 300);
}

/* Liveness is two separate questions, and conflating them is a trap.
   Phones throttle timers to a crawl when the screen locks or the player
   switches apps, so a quiet heartbeat does NOT mean someone has left.
   QUIET_MS: stop *waiting* on them, so the round can end.
   GONE_MS:  actually drop them from the room. Deliberately much longer. */
const QUIET_MS = 15000;
const GONE_MS = 60000;

const seenRecently = p => p.host || !p.lastSeen || Date.now() - p.lastSeen < QUIET_MS;

/* players the round is still legitimately waiting on */
function waitingOn() {
  return M.players.filter(p => !M.answers[p.id] && seenRecently(p));
}

function pruneAbsent() {
  if (!M.isHost) return false;
  const now = Date.now();
  const gone = M.players.filter(p => !p.host && p.lastSeen && now - p.lastSeen > GONE_MS);
  if (!gone.length) return false;
  gone.forEach(p => { delete M.answers[p.id]; });
  M.players = M.players.filter(p => !gone.includes(p));
  M.answeredCount = Object.keys(M.answers).length;
  M.notice = t('dropped')(gone.map(p => p.name).join(', '));
  setTimeout(() => { M.notice = ''; renderLive(); }, 5000);
  return true;
}

function closeIfEveryoneAnswered() {
  if (M.phase !== 'question') return;
  M.answeredCount = Object.keys(M.answers).length;
  if (waitingOn().length === 0) {
    clearTimeout(M.hostTimer);
    M.hostTimer = setTimeout(closeQuestion, 150);
  }
}

function takeAnswer(p) {
  const who = M.players.find(x => x.id === p.id);
  if (who) who.lastSeen = Date.now();   /* answering proves they're here */
  if (M.phase !== 'question' || p.qid !== M.qid || M.answers[p.id]) return;
  const limit = M.seconds * 1000;
  const elapsed = Math.min(Math.max(+p.elapsed || 0, 0), limit);
  const ok = M.qView.isTyped
    ? (typeof p.value === 'string' && p.value.trim() !== '' && M.q.typed.check(p.value))
    : p.value === M.q.answer;
  M.answers[p.id] = { ok, elapsed, value: p.value };
  M.answeredCount = Object.keys(M.answers).length;
  broadcastSync(); renderLive();
  closeIfEveryoneAnswered();
}

function closeQuestion() {
  if (M.phase !== 'question') return;
  const base = M.qView.isTyped ? 150 : 100;
  const limit = M.seconds * 1000;
  const results = M.players.map(pl => {
    const a = M.answers[pl.id];
    const ok = !!(a && a.ok);
    const gain = ok ? base + Math.round(50 * (1 - a.elapsed / limit)) : 0;
    pl.score += gain;
    if (ok) pl.correct++;
    return { id: pl.id, ok, gain, answered: !!a };
  });
  M.results = results;
  M.phase = M.qIndex >= M.rounds ? 'final' : 'reveal';
  const payload = {
    qid: M.qid, phase: M.phase, explain: M.q.explain,
    examples: M.q.examples || null,
    answerIndex: M.qView.isTyped ? null : M.q.answer,
    results, players: publicPlayers(), qIndex: M.qIndex, rounds: M.rounds
  };
  M.net && M.net.send('reveal', payload);
  renderLive();
  if (M.phase === 'reveal') {
    clearTimeout(M.hostTimer);
    M.hostTimer = setTimeout(askLive, REVEAL_MS);
  }
}

function applyReveal(p) {
  M.phase = p.phase; M.results = p.results; M.players = p.players;
  M.qIndex = p.qIndex; M.rounds = p.rounds;
  M.revealExplain = p.explain; M.revealExamples = p.examples;
  M.revealAnswer = p.answerIndex;
  renderLive();
}

/* ————— player: answering ————— */
function sendLiveAnswer(value) {
  if (M.myAnswer !== null || M.phase !== 'question') return;
  M.myAnswer = value;
  const elapsed = M.seconds * 1000 - Math.max(0, M.endsAt - Date.now());
  if (M.isHost) takeAnswer({ id: M.me.id, qid: M.qView.qid, value, elapsed });
  else M.net.send('answer', { id: M.me.id, qid: M.qView.qid, value, elapsed });
  renderLive();
}

/* ————— rendering ————— */
const nameOf = id => (M.players.find(p => p.id === id) || {}).name || '?';

function board(highlightMe) {
  return `<ul class="lb">${[...M.players].sort((a, b) => b.score - a.score).map((p, i) => {
    const r = M.results && M.results.find(x => x.id === p.id);
    const gain = r && r.gain ? `<span class="gainpill">+${r.gain}</span>` : '';
    return `<li${highlightMe && p.id === M.me.id ? ' class="me"' : ''}>
      <span class="rank">${i + 1}</span><span class="nm">${esc(p.name)}</span>${gain}<b>${p.score}</b></li>`;
  }).join('')}</ul>`;
}

function renderLive() {
  const el = $('#liveBody');
  if (!el) return;

  /* The host syncs every 3s. Re-rendering the card on each one would replace
     the answer box mid-word — wiping what you typed and closing the keyboard.
     While the same question is still up, patch the one line that changes. */
  if (M.phase === 'question' && M.qView
      && el.dataset.qid === String(M.qView.qid)
      && el.dataset.locked === String(M.myAnswer !== null)) {
    const line = el.querySelector('#answeredLine');
    if (line) line.textContent = t('answered')(M.answeredCount, M.players.length);
    const note = el.querySelector('.notice');
    if (note) note.textContent = M.notice;
    return;
  }

  clearInterval(M.tick);
  el.dataset.qid = '';
  el.dataset.locked = '';
  const notice = M.notice ? `<p class="notice">${esc(M.notice)}</p>` : '';

  if (M.phase === 'lobby' || M.phase === 'idle') {
    const url = location.origin + location.pathname + '?room=' + M.code;
    el.innerHTML = `${notice}
      ${IS_LOCAL ? `<div class="localwarn">
        <strong>${t('localTitle')}</strong>
        <span>${t('localBody')}</span>
        <a class="gobtn" href="${esc(PUBLIC_URL)}">${t('localGo')}</a></div>` : ''}
      ${M.isHost && !IS_LOCAL ? `<div class="hostbanner">
        <strong>${t('youHost')}</strong><span>${t('youHostSub')}</span></div>` : ''}
      <div class="card center">
        <div class="eyebrow">${t('lobbyCode')}</div>
        <div class="code">${esc(M.code)}</div>

      ${M.isHost

             <div class="grid2" style="margin-top:0">

                 <option value="typed">${t('modeTyped')}</option>
               </select></div>
           </div>`
        : `<p class="dimtext center">${t('lobbyWait')}</p>`}
      <p class="center" style="margin-top:16px"><button class="ghost" id="leaveBtn">${t('leave')}</button></p>`;

      const btn = $('#copyBtn');
      linkField.select();
      linkField.setSelectionRange(0, 999);
      let done = false;
      try { await navigator.clipboard.writeText(url); done = true; } catch (e) { /* fall through */ }
      if (!done) { try { done = document.execCommand('copy'); } catch (e) { /* fall through */ } }
      btn.textContent = done ? t('lobbyCopied') : t('lobbySelect');
      setTimeout(() => { btn.textContent = t('lobbyCopy'); }, 2500);
    };
    const sh = $('#shareBtn');
    if (sh) sh.onclick = async () => {
      try { await navigator.share({ title: 'Correspondance', url }); } catch (e) { /* dismissed */ }
    };
    const s = $('#startLiveBtn'); if (s) s.onclick = startLive;
    $('#leaveBtn').onclick = leaveRoom;
    return;
  }

  if (M.phase === 'question' && M.qView) {
    const q = M.qView;
    const done = M.myAnswer !== null;
    el.innerHTML = `${notice}
      <div class="card">
        <div class="qhead"><b>${t('qOf')(M.qIndex, M.rounds)}</b>
          <span>${t('kinds')[q.kind]}</span>
          <span class="tag">${q.isTyped ? t('tagTyped') : t('tagMc')}</span>
          <span id="clock2"></span></div>
        <div class="track"><div id="bar2"></div></div>
        <p id="qText">${q.prompt}</p>
        ${q.note ? `<p id="qNote">${q.note}</p>` : ''}
        ${done ? `<p class="waitmsg">${t('waiting')}</p>`
          : q.isTyped
            ? `<div id="typed2"><input id="typedInput2" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(t(q.ph))}">
               <button id="typedSubmit2" class="primary">${t('submit')}</button></div>`
            : `<div id="choices2"${twoUp(q.kind)}>${q.choices.map((c, i) => `<button class="choice" data-i="${i}">${c}</button>`).join('')}</div>`}
        <p class="dimtext center" id="answeredLine">${t('answered')(M.answeredCount, M.players.length)}</p>
      </div>`;

    const bar = $('#bar2'), clock = $('#clock2');
    const paint = () => {
      const left = Math.max(0, M.endsAt - Date.now());
      bar.style.width = (100 * left / (M.seconds * 1000)) + '%';
      clock.textContent = Math.ceil(left / 1000);
    };
    paint();
    M.tick = setInterval(paint, 100);
    el.dataset.qid = String(q.qid);
    el.dataset.locked = String(done);

    if (!done) {
      if (q.isTyped) {
        const go = () => sendLiveAnswer($('#typedInput2').value);
        $('#typedSubmit2').onclick = go;
        $('#typedInput2').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
        $('#typedInput2').focus();
      } else {
        $('#choices2').addEventListener('click', e => {
          const b = e.target.closest('.choice');
          if (b) sendLiveAnswer(+b.dataset.i);
        });
      }
    }
    return;
  }

  if (M.phase === 'final') {
    const explain = M.isHost ? M.q.explain : M.revealExplain;
    const examples = M.isHost ? M.q.examples : M.revealExamples;
    const ranked = [...M.players].sort((a, b) => b.score - a.score);
    const top = ranked[0] ? ranked[0].score : 0;
    const winners = ranked.filter(p => p.score === top);
    const runnerUp = ranked.find(p => p.score < top);
    const headline = winners.length > 1
      ? t('tie')(winners.map(w => w.name).join(' & '))
      : runnerUp ? t('winsBy')(ranked[0].name, top - runnerUp.score) : t('wins')(ranked[0].name);

    el.innerHTML = `${notice}
      <div class="card">
        <div class="eyebrow">${t('finalTitle')}</div>
        <div id="winner">${esc(headline)}</div>
        <ul class="lb final">${ranked.map((p, i) => `<li${p.id === M.me.id ? ' class="me"' : ''}>
          <span class="rank">${i + 1}</span><span class="nm">${esc(p.name)}</span>
          <span class="det">${t('right')(p.correct, M.rounds)}</span><b>${p.score}</b></li>`).join('')}</ul>
      </div>
      <div class="card">
        <div class="eyebrow" style="margin-bottom:8px">${t('lastAnswer')}</div>
        <p id="explain" style="margin:0">${explain}${examples ? ` <span style="color:var(--dim)">${t('egAccepted')} ${examples.map(esc).join(', ')}.</span>` : ''}</p>
      </div>
      ${M.isHost ? `<button class="primary" id="againLive">${t('playAgainLive')}</button>` : ''}

    if (ag) ag.onclick = () => {
      M.players.forEach(p => { p.score = 0; p.correct = 0; });
      M.phase = 'lobby'; M.qIndex = 0; M.results = null; M.qView = null;
      G.seen.clear();
      broadcastSync(); renderLive();
    };
    $('#leaveBtn2').onclick = leaveRoom;
    return;
  }

  if (M.phase === 'reveal') {
    const explain = M.isHost ? M.q.explain : M.revealExplain;
    const examples = M.isHost ? M.q.examples : M.revealExamples;
    const mine = M.results && M.results.find(r => r.id === M.me.id);
    const got = M.results ? M.results.filter(r => r.ok).length : 0;
    const headline = got === 0 ? t('nobody')
      : got === M.players.length ? t('everyone') : t('someGot')(got);

    el.innerHTML = `${notice}
      <div class="card">
        ${mine ? `<p class="verdict ${mine.ok ? 'good' : 'bad'}">${mine.ok ? t('good') : t('bad')}</p>` : ''}
        <p id="explain">${explain}${examples ? ` <span style="color:var(--dim)">${t('egAccepted')} ${examples.map(esc).join(', ')}.</span>` : ''}</p>
        <p class="dimtext">${headline}</p>
      </div>
      <div class="card">
        <div class="eyebrow" style="margin-bottom:6px">${t('standings')}</div>
        ${board(true)}
      </div>
      ${M.isHost ? `<button class="primary" id="skipReveal">${t('nextQ')}</button>` : ''}
      <p class="dimtext center">${t('qOf')(M.qIndex, M.rounds)}</p>`;
    const sk = $('#skipReveal');
    if (sk) sk.onclick = () => { clearTimeout(M.hostTimer); askLive(); };
    return;
  }

  if (M.phase === 'unreachable') {
    el.innerHTML = `<div class="card center"><p class="dimtext">${t('offline')}</p></div>
      <button class="primary" id="offlineSolo">${t('homeSolo')}</button>
      <p class="center" style="margin-top:16px"><button class="ghost" id="leaveBtn4">${t('back')}</button></p>`;
    $('#offlineSolo').onclick = () => { M.phase = 'idle'; show('setup'); };
    $('#leaveBtn4').onclick = leaveRoom;
    return;
  }

  if (M.phase === 'lost') {
    el.innerHTML = `<div class="card center"><p class="verdict bad">${esc(M.notice)}</p>
      ${board(true)}</div>
      <button class="primary" id="leaveBtn3">${t('leave')}</button>`;
    $('#leaveBtn3').onclick = leaveRoom;
    return;
  }

  el.innerHTML = `<div class="card center"><p class="dimtext">${notice || t('connecting')}</p></div>`;
}

/* ————— remembering the room across a reload ————— */
function rememberRoom(code, name, host) {
  try { sessionStorage.setItem('corr.room', JSON.stringify({ code, name, host })); } catch (e) { /* private mode */ }
}
function forgetRoom() {
  try { sessionStorage.removeItem('corr.room'); } catch (e) { /* private mode */ }
}
function recallRoom() {
  try { return JSON.parse(sessionStorage.getItem('corr.room') || 'null'); } catch (e) { return null; }
}

/* ————— entry points ————— */
function hostRoom(name, code) {
  M.isHost = true;
  M.me.name = name;
  M.phase = 'lobby';
  M.players = [{ id: myId(), name, score: 0, correct: 0, host: true }];
  M.me.id = myId();
  code = code || makeCode();
  rememberRoom(code, name, true);
  connect(code, () => broadcastSync());
  clearInterval(M.beat);
  M.beat = setInterval(() => {
    if (!M.isHost) return;
    if (pruneAbsent()) renderLive();
    closeIfEveryoneAnswered();   /* re-check: someone may have just gone quiet */
    broadcastSync();
  }, 3000);
  show('live');
  renderLive();
}

function joinAs(code, name) {
  M.isHost = false;
  M.me.name = name;
  M.phase = 'idle';
  M.notice = t('connecting');
  rememberRoom(code, name, false);
  connect(code, () => M.net.send('hello', { id: M.me.id, name }));
  clearInterval(M.beat);
  M.beat = setInterval(() => { if (!M.isHost && M.net) M.net.send('hello', { id: M.me.id, name }); }, 4000);
  /* the host broadcasts every 3s — a long silence means it went away without saying so */
  M.lastSync = Date.now();
  clearInterval(M.watch);
  M.watch = setInterval(() => {
    const playing = ['lobby', 'question', 'reveal'].includes(M.phase);
    if (playing && Date.now() - M.lastSync > 14000) {
      M.phase = 'lost'; M.notice = t('hostLeft');
      clearInterval(M.watch); renderLive();
    }
  }, 2000);
  show('live');
  renderLive();
  setTimeout(() => {
    if (M.phase === 'idle') { M.notice = t('noRoom'); renderLive(); }
  }, 6000);
}

/* Coming back from a locked screen or another app: timers were throttled to
   near-nothing, so announce immediately rather than waiting for the next tick. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !M.net) return;
  if (M.isHost) broadcastSync();
  else M.net.send('hello', { id: M.me.id, name: M.me.name });
});

/* the host tells the room when it closes the tab */
window.addEventListener('pagehide', () => {
  if (M.net && M.isHost) M.net.send('closed', {});
  else if (M.net) M.net.send('bye', { id: M.me.id });
});

/* "de" + "le Moulin Rouge" is "du Moulin Rouge", not "de le Moulin Rouge".
   The landmark names carry their own article, so contract before joining. */
function deFr(name) {
  if (/^les /i.test(name)) return 'des ' + name.slice(4);
  if (/^le /i.test(name)) return 'du ' + name.slice(3);
  if (/^la /i.test(name)) return 'de la ' + name.slice(3);
  if (/^l['’]/i.test(name)) return 'de ' + name;
  return 'de ' + name;
}

/* ————— the answer pool ————— */
const plain = s => strip(s).toUpperCase().replace(/[^A-Z]/g, '');

/* single-word names only: "SAINTGERMAINDESPRES" is nobody's idea of fun */
const CROSS_POOL = STATION_NAMES
  .filter(n => !/[\s\-–']/.test(n))
  .map(n => ({ name: n, letters: plain(n) }))
  .filter(w => w.letters.length >= 4 && w.letters.length <= 10);

/* landmark > terminus > interchange > plain. Anything but "plain" gives the
   solver something to actually reason from. */
function clueKind(name) {
  if (LANDMARKS.some(l => l[2] === name)) return 'landmark';
  if (TERMINI[name]) return 'terminus';
  if (STATIONS[name].length > 1) return 'hub';
  return 'plain';
}

function clueFor(name) {
  switch (clueKind(name)) {
    case 'landmark': {
      const land = LANDMARKS.find(l => l[2] === name);
      return t('clueLandmark')(LANG === 'fr' ? land[1] : land[0]);
    }
    case 'terminus': return t('clueTerminus')(TERMINI[name][0]);
    case 'hub': return t('clueHub')(STATIONS[name][0], STATIONS[name][1]);
    /* naming the line's two ends turns a shrug into something you can picture */
    default: return t('clueLine')(STATIONS[name][0], ends(STATIONS[name][0]));
  }
}

/* strong clues first, and only a couple of weak ones per grid */
const STRONG = CROSS_POOL.filter(w => clueKind(w.name) !== 'plain');
const PLAIN = CROSS_POOL.filter(w => clueKind(w.name) === 'plain');

/* A dense 5x5 is impossible here: the network has three four-letter and
   twelve five-letter single-word stations. The mini is a small open grid
   with short answers instead — same idea, honest about the vocabulary. */
const SHAPES = {
  mini: { target: 5, maxLen: 7, span: 8, maxPlain: 1, tries: 40 },
  full: { target: 8, maxLen: 10, span: 12, maxPlain: 2, tries: 25 }
};

/* ————— generation ————— */
const SIZE = 15;

function blankGrid() {
  return Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
}

function fits(grid, letters, r, c, dir) {
  const dr = dir === 'D' ? 1 : 0, dc = dir === 'A' ? 1 : 0;
  const end = { r: r + dr * (letters.length - 1), c: c + dc * (letters.length - 1) };
  if (r < 0 || c < 0 || end.r >= SIZE || end.c >= SIZE) return false;

  /* the cells just before and just after the word must be empty */
  const before = { r: r - dr, c: c - dc };
  const after = { r: end.r + dr, c: end.c + dc };
  for (const p of [before, after]) {
    if (p.r >= 0 && p.c >= 0 && p.r < SIZE && p.c < SIZE && grid[p.r][p.c]) return false;
  }

  let crossings = 0;
  for (let i = 0; i < letters.length; i++) {
    const rr = r + dr * i, cc = c + dc * i;
    const cur = grid[rr][cc];
    if (cur) {
      if (cur !== letters[i]) return false;
      crossings++;
      continue;
    }
    /* an empty cell must not sit alongside another word, or we'd create
       accidental two-letter words running the other way */
    const sides = dir === 'A' ? [[rr - 1, cc], [rr + 1, cc]] : [[rr, cc - 1], [rr, cc + 1]];
    for (const [sr, sc] of sides) {
      if (sr >= 0 && sc >= 0 && sr < SIZE && sc < SIZE && grid[sr][sc]) return false;
    }
  }
  return crossings > 0;
}

function put(grid, letters, r, c, dir) {
  const dr = dir === 'D' ? 1 : 0, dc = dir === 'A' ? 1 : 0;
  for (let i = 0; i < letters.length; i++) grid[r + dr * i][c + dc * i] = letters[i];
}

function generatePuzzle(shape) {
  const fit = w => w.letters.length <= shape.maxLen;
  const grid = blankGrid();
  const entries = [];
  const pool = shuffle(STRONG.filter(fit)).concat(shuffle(PLAIN.filter(fit)));
  let plainUsed = 0;

  const seed = shuffle(STRONG.filter(fit)).find(w => w.letters.length >= 5) || pool[0];
  const r0 = Math.floor(SIZE / 2), c0 = Math.floor((SIZE - seed.letters.length) / 2);
  put(grid, seed.letters, r0, c0, 'A');
  entries.push({ ...seed, r: r0, c: c0, dir: 'A' });

  for (const w of pool) {
    if (entries.length >= shape.target) break;
    if (entries.some(e => e.name === w.name)) continue;
    const weak = clueKind(w.name) === 'plain';
    if (weak && plainUsed >= shape.maxPlain) continue;

    const spots = [];
    for (const e of entries) {
      const dir = e.dir === 'A' ? 'D' : 'A';
      for (let i = 0; i < w.letters.length; i++) {
        for (let j = 0; j < e.letters.length; j++) {
          if (w.letters[i] !== e.letters[j]) continue;
          const er = e.r + (e.dir === 'D' ? j : 0), ec = e.c + (e.dir === 'A' ? j : 0);
          const r = dir === 'D' ? er - i : er;
          const c = dir === 'A' ? ec - i : ec;
          if (fits(grid, w.letters, r, c, dir)) spots.push({ r, c, dir });
        }
      }
    }
    if (!spots.length) continue;
    const s = rnd(spots);
    put(grid, w.letters, s.r, s.c, s.dir);
    entries.push({ ...w, r: s.r, c: s.c, dir: s.dir });
    if (weak) plainUsed++;
  }
  return entries.length >= Math.min(4, shape.target) ? { grid, entries } : null;
}

/* crop to the used area and number the starting squares */
function layout(puz) {
  let minR = SIZE, maxR = -1, minC = SIZE, maxC = -1;
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    if (puz.grid[r][c]) {
      minR = Math.min(minR, r); maxR = Math.max(maxR, r);
      minC = Math.min(minC, c); maxC = Math.max(maxC, c);
    }
  }
  const rows = maxR - minR + 1, cols = maxC - minC + 1;
  const solution = Array.from({ length: rows }, (_, r) =>
    Array.from({ length: cols }, (_, c) => puz.grid[r + minR][c + minC]));
  const entries = puz.entries.map(e => ({ ...e, r: e.r - minR, c: e.c - minC }));

  entries.sort((a, b) => a.r - b.r || a.c - b.c);
  let n = 0;
  const numAt = {};
  entries.forEach(e => {
    const key = e.r + ',' + e.c;
    if (!numAt[key]) numAt[key] = ++n;
    e.num = numAt[key];
    e.cells = Array.from({ length: e.letters.length }, (_, i) => ({
      r: e.r + (e.dir === 'D' ? i : 0), c: e.c + (e.dir === 'A' ? i : 0)
    }));
  });
  return { rows, cols, solution, entries, numAt };
}

/* ————— state ————— */
const X = { rows: 0, cols: 0, solution: [], entries: [], numAt: {}, letters: {},
  active: null, cell: null, given: {}, hints: 0, mode: 'mini' };

/* Generation is cheap, so make several and keep the tightest — a 15-wide grid
   leaves ~17px squares on a small phone, which is unplayable. */
function newPuzzle() {
  const shape = SHAPES[X.mode] || SHAPES.full;
  let best = null;
  for (let i = 0; i < shape.tries; i++) {
    const puz = generatePuzzle(shape);
    if (!puz) continue;
    const L = layout(puz);
    const span = Math.max(L.rows, L.cols);
    if (span > shape.span) continue;
    if (!best || span < best.span || (span === best.span && L.entries.length > best.L.entries.length)) {
      best = { L, span };
    }
  }
  if (!best) {                       /* nothing compact turned up — take any */
    let puz = null;
    for (let i = 0; i < 40 && !puz; i++) puz = generatePuzzle(shape);
    if (!puz) return;
    best = { L: layout(puz) };
  }
  Object.assign(X, best.L, { letters: {}, active: null, cell: null, given: {}, hints: 0 });
  X.active = X.entries[0];
  X.cell = { ...X.active.cells[0] };
  renderCross();
}

const key = (r, c) => r + ',' + c;
const isBlock = (r, c) => !X.solution[r] || !X.solution[r][c];

function entriesAt(r, c) {
  return X.entries.filter(e => e.cells.some(p => p.r === r && p.c === c));
}

function selectCell(r, c, toggle) {
  if (isBlock(r, c)) return;
  const here = entriesAt(r, c);
  if (toggle && X.cell && X.cell.r === r && X.cell.c === c && here.length > 1) {
    X.active = here.find(e => e !== X.active) || X.active;
  } else if (!here.includes(X.active)) {
    X.active = here[0];
  }
  X.cell = { r, c };
  renderCross();
  $('#crossInput').focus();
}

function step(delta) {
  if (!X.active || !X.cell) return;
  const idx = X.active.cells.findIndex(p => p.r === X.cell.r && p.c === X.cell.c);
  const next = X.active.cells[idx + delta];
  if (next) X.cell = { ...next };
}

function typeLetter(ch) {
  if (!X.cell) return;
  X.letters[key(X.cell.r, X.cell.c)] = ch;
  step(1);
  renderCross();
}

function backspace() {
  if (!X.cell) return;
  const k = key(X.cell.r, X.cell.c);
  if (X.letters[k]) delete X.letters[k];
  else { step(-1); delete X.letters[key(X.cell.r, X.cell.c)]; }
  renderCross();
}

/* ————— hints —————
   One letter at a time in the word you're on: the first gap, or the first
   letter you've got wrong. Given letters stay marked so you can see what you
   were handed rather than worked out. */
function giveHint() {
  if (!X.active) return;
  const cells = X.active.cells;
  let target = cells.findIndex((p, i) => !X.letters[key(p.r, p.c)]);
  if (target < 0) target = cells.findIndex((p, i) => X.letters[key(p.r, p.c)] !== X.active.letters[i]);
  if (target < 0) { $('#crossMsg').textContent = t('crossHintFull'); $('#crossMsg').className = 'crossmsg'; return; }

  const p = cells[target];
  X.letters[key(p.r, p.c)] = X.active.letters[target];
  X.given[key(p.r, p.c)] = true;
  X.hints++;
  X.marks = {};
  X.cell = { ...(cells[target + 1] || p) };
  $('#crossMsg').textContent = t('hintsUsed')(X.hints);
  $('#crossMsg').className = 'crossmsg';
  renderCross();
}

/* ————— rendering ————— */
function renderCross() {
  const g = $('#crossGrid');
  if (!g || !X.rows) return;
  g.style.setProperty('--cols', X.cols);
  const activeCells = new Set((X.active ? X.active.cells : []).map(p => key(p.r, p.c)));

  let html = '';
  for (let r = 0; r < X.rows; r++) {
    for (let c = 0; c < X.cols; c++) {
      if (isBlock(r, c)) { html += '<div class="xc block"></div>'; continue; }
      const k = key(r, c);
      const num = X.numAt[k];
      const cls = ['xc'];
      if (activeCells.has(k)) cls.push('inword');
      if (X.cell && X.cell.r === r && X.cell.c === c) cls.push('here');
      if (X.marks && X.marks[k]) cls.push(X.marks[k]);
      if (X.given[k]) cls.push('given');
      html += `<div class="${cls.join(' ')}" data-r="${r}" data-c="${c}">${
        num ? `<b>${num}</b>` : ''}${X.letters[k] || ''}</div>`;
    }
  }
  g.innerHTML = html;

  const list = dir => X.entries.filter(e => e.dir === dir)
    .sort((a, b) => a.num - b.num)
    .map(e => `<li${e === X.active ? ' class="on"' : ''} data-num="${e.num}" data-dir="${e.dir}">
      <span class="n">${e.num}</span>
      <span>${esc(clueFor(e.name))} <span class="len">${t('clueLetters')(e.letters.length)}</span></span></li>`)
    .join('');
  $('#crossAcross').innerHTML = list('A');
  $('#crossDown').innerHTML = list('D');
  $('#crossAcrossLbl').textContent = t('crossAcross');
  $('#crossDownLbl').textContent = t('crossDown');

  const cur = $('#crossCurrent');
  if (cur) cur.textContent = X.active ? clueFor(X.active.name) + ' ' + t('clueLetters')(X.active.letters.length) : '';
}

function checkGrid() {
  X.marks = {};
  let wrong = 0, filled = 0;
  for (let r = 0; r < X.rows; r++) for (let c = 0; c < X.cols; c++) {
    if (isBlock(r, c)) continue;
    const k = key(r, c);
    const v = X.letters[k];
    if (!v) continue;
    filled++;
    if (v === X.solution[r][c]) X.marks[k] = 'ok'; else { X.marks[k] = 'no'; wrong++; }
  }
  const done = !wrong && filled >= new Set(X.entries.flatMap(e => e.cells.map(p => key(p.r, p.c)))).size;
  $('#crossMsg').textContent = !filled ? t('crossEmpty')
    : done ? (X.hints ? t('crossDoneHints')(X.hints) : t('crossDone'))
      : wrong ? t('crossWrong')(wrong) : t('crossAllRight');
  $('#crossMsg').className = 'crossmsg ' + (done ? 'good' : wrong ? 'bad' : '');
  renderCross();
}

function revealActive() {
  if (!X.active) return;
  X.active.cells.forEach((p, i) => {
    if (X.letters[key(p.r, p.c)] !== X.active.letters[i]) X.hints++;
    X.letters[key(p.r, p.c)] = X.active.letters[i];
    X.given[key(p.r, p.c)] = true;
  });
  X.marks = {};
  renderCross();
}

/* ————— wiring ————— */
function crossLangRefresh() {
  $('#homeCross').innerHTML = `<span class="opt">${t('homeCross')}</span><span class="optsub">${t('homeCrossSub')}</span>`;
  $('#crossTitle').textContent = t('crossTitle');
  $('#crossHint').textContent = t('crossHint');
  $('#crossMiniBtn').textContent = t('crossMini');
  $('#crossFullBtn').textContent = t('crossFull');
  $('#crossShapeNote').textContent = X.mode === 'mini' ? t('crossMiniNote') : t('crossFullNote');
  $('#crossHintBtn').textContent = t('crossHintBtn');
  $('#crossCheckBtn').textContent = t('crossCheck');
  $('#crossRevealBtn').textContent = t('crossReveal');
  $('#crossNewBtn').textContent = t('crossNew');
  $('#crossBack').textContent = t('back');
  if (X.rows) renderCross();
}
LANG_HOOKS.push(crossLangRefresh);
crossLangRefresh();

$('#homeCross').onclick = () => { show('cross'); if (!X.rows) newPuzzle(); else renderCross(); };
$('#crossBack').onclick = () => show('home');
$('#crossNewBtn').onclick = () => { X.marks = {}; $('#crossMsg').textContent = ''; $('#crossMsg').className = 'crossmsg'; newPuzzle(); };
function setMode(mode) {
  X.mode = mode;
  document.querySelectorAll('.shapes button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  $('#crossShapeNote').textContent = mode === 'mini' ? t('crossMiniNote') : t('crossFullNote');
  $('#crossMsg').textContent = '';
  $('#crossMsg').className = 'crossmsg';
  newPuzzle();
}
document.querySelectorAll('.shapes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));

$('#crossHintBtn').onclick = giveHint;
$('#crossCheckBtn').onclick = checkGrid;
$('#crossRevealBtn').onclick = revealActive;

$('#crossGrid').addEventListener('click', e => {
  const cell = e.target.closest('.xc');
  if (!cell || cell.classList.contains('block')) return;
  selectCell(+cell.dataset.r, +cell.dataset.c, true);
});

document.querySelectorAll('#crossAcross, #crossDown').forEach(ul => {
  ul.addEventListener('click', e => {
    const li = e.target.closest('li');
    if (!li) return;
    const entry = X.entries.find(x => x.num === +li.dataset.num && x.dir === li.dataset.dir);
    if (!entry) return;
    X.active = entry;
    X.cell = { ...entry.cells[0] };
    renderCross();
    $('#crossInput').focus();
  });
});

/* one offscreen input drives the whole grid — it is what raises the phone
   keyboard, and it keeps letters flowing even when focus wanders */
$('#crossInput').addEventListener('keydown', e => {
  if (e.key === 'Backspace') { e.preventDefault(); backspace(); return; }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); step(1); renderCross(); return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); step(-1); renderCross(); return; }
  if (e.key === 'Tab' || e.key === 'Enter') {
    e.preventDefault();
    const i = X.entries.indexOf(X.active);
    X.active = X.entries[(i + 1) % X.entries.length];
    X.cell = { ...X.active.cells[0] };
    renderCross();
  }
});

$('#crossInput').addEventListener('input', e => {
  const raw = e.target.value;
  e.target.value = '';
  const ch = plain(raw).slice(-1);
  if (ch) typeLetter(ch);
});

</script>
</body>
</html>
